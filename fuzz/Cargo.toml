[package]
name = "beezip-fuzz"
version = "0.0.0"
description = "cargo-fuzz targets for beezip-core (docs/M1.md §7)"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: cargo-fuzz needs nightly, and the main workspace is pinned to stable.
[workspace]

# The main workspace's patched hadris-iso (docs/M5.md §5.9), so the fuzzers read what BeeZip ships.
[patch.crates-io]
hadris-iso = { path = "../vendor/hadris-iso" }

[dependencies]
beezip-core = { path = "../crates/beezip-core" }
beezip-menu = { path = "../crates/beezip-menu" }
libfuzzer-sys = "0.4.13"
tempfile = "3.27.0"

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar"
path = "fuzz_targets/tar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codecs"
path = "fuzz_targets/codecs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sevenz"
path = "fuzz_targets/sevenz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rar"
path = "fuzz_targets/rar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "menu"
path = "fuzz_targets/menu.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
# As in the main workspace: a decoder panic must stay a panic the fuzzer reports.
panic = "unwind"
# cargo-fuzz builds with -Cdebug-assertions (overflow checks too). Declaring them here lets one
# crate opt out: libbz2-rs-sys 0.2.6 lets a counter wrap on bad data and then rejects the data,
# and with overflow checks that wrap is a panic (docs/M3.md §11). Everything else keeps them.
debug-assertions = true

[profile.release.package.libbz2-rs-sys]
overflow-checks = false

[[bin]]
name = "cpio"
path = "fuzz_targets/cpio.rs"
test = false
doc = false
bench = false

