[package]
name = "beezip-desktop"
description = "BeeZip desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (rust-lang/cargo#8519).
# rlib only: the template's staticlib/cdylib are for mobile targets.
name = "beezip_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
beezip-commands.workspace = true
beezip-menu.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true

# Drag-out (docs/M6.md §8.4): BeeZip's own IDataObject and IDropSource, and the temp folder.
[target.'cfg(windows)'.dependencies]
tempfile.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole",
    "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }
windows-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
# MockRuntime, for the updater's signature test.
tauri = { workspace = true, features = ["test"] }

# No [profile.release] here: Cargo ignores profiles in workspace members, and the template's
# `panic = "abort"` would break the engine's catch_unwind. See the workspace Cargo.toml.

[lints]
workspace = true
