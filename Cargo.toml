[workspace]
resolver = "3"
members = [
    "crates/beezip-core", "crates/beezip-unrar", "crates/beezip-menu", "crates/beezip-commands",
    "crates/beezip-mcp", "crates/beezip-cli", "crates/beezip-shell", "apps/desktop/src-tauri", "xtask",
]
# A plain `cargo build`/`cargo test` skips the Tauri app (~450 extra crates). CI and the checklist pass --workspace.
default-members = [
    "crates/beezip-core", "crates/beezip-unrar", "crates/beezip-menu", "crates/beezip-commands",
    "crates/beezip-mcp", "crates/beezip-cli", "crates/beezip-shell", "xtask",
]
# cargo-fuzz needs nightly, so fuzz/ is its own workspace (docs/M1.md §7).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
beezip-core     = { path = "crates/beezip-core" }
beezip-commands = { path = "crates/beezip-commands" }
beezip-mcp      = { path = "crates/beezip-mcp" }
beezip-menu     = { path = "crates/beezip-menu" }
beezip-unrar    = { path = "crates/beezip-unrar" }

# Stable APIs: caret at today's version; Cargo.lock pins the build.
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror  = "2.0.21"
anyhow     = "1.0.104"
clap       = { version = "4.6.7", features = ["derive", "wrap_help"] }
schemars   = "1.2.3"   # must match rmcp's major (rmcp 3.8 -> schemars 1.2); tool schemas pass straight through
tokio      = { version = "1.54.1", features = ["rt", "macros"] }

# Churny APIs: exact pins, bumped on purpose (PLAN §5).
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
rmcp  = { version = "=3.8.0", default-features = false, features = ["server", "transport-io", "elicitation"] }
tauri                        = "=2.12.5"   # same minor as @tauri-apps/api + cli (2.12.4); tauri build rejects a mismatch
tauri-build                  = "=2.7.4"
tauri-plugin-opener          = "=2.7.2"
tauri-plugin-dialog          = "=2.8.4"   # brings rfd and tauri-plugin-fs
tauri-plugin-single-instance = "=2.5.5"   # must be the first plugin registered

assert_cmd = "2.2.2"
predicates = "3.1.4"

# M1 formats and codecs (docs/M1.md §1). Only beezip-core uses these.
zip = { version = "=9.2.2", default-features = false, features = [
    "aes-crypto", "deflate-flate2-zlib-rs", "deflate64", "bzip2", "zstd", "xz", "lzma", "ppmd",
    "legacy-zip", "time",
] }
tar        = { version = "0.4.46", default-features = false }
flate2     = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
bzip2      = "0.6.1"
crc32fast  = "1.5.4"
lzma-rust2 = "=0.23.0"   # the version zip 9.2.2 requires; a newer one would build a second copy
zstd       = { version = "0.14.3", default-features = false, features = ["zstdmt"] }
lz4_flex   = "0.14.0"
brotli     = "9.1.1"
snap       = "1.1.2"
file-format = { version = "0.29.0", default-features = false, features = ["reader-exe", "reader-txt"] }
time       = { version = "0.3.55", features = ["formatting", "local-offset", "parsing"] }
filetime   = "0.2.29"
tempfile   = "3.27.0"
walkdir    = "2.5.0"
memchr     = "2.8.3"
globset    = { version = "0.4.21", default-features = false }
dirs       = "7.0.0"
toml       = "1.1.8"
toml_edit  = "0.25.17"   # settings.set keeps config.toml's comments (docs/M4.md §1)
base64     = "0.23.1"
# M4 Explorer integration (docs/M4.md §1): the same windows 0.62.2 that Tauri already builds, so
# one copy serves the shell DLL, the commands and the app. Features are chosen per crate.
windows          = "=0.62.2"
windows-core     = "=0.62.2"
windows-registry = "0.6.1"
windows-result   = "0.4.1"   # windows-registry's error type, which it doesn't re-export
windows-future   = "0.3.2"   # the deployment operations' type and blocking join(), as windows 0.62.2 uses
indicatif  = "0.18.6"

# M3 formats (docs/M3.md §1). Churny, so pinned exactly.
unrar_sys = "=0.5.8"   # UnRAR 7.1.0, compiled with cc; only beezip-unrar uses it (§3.4)
sevenz-rust2 = { version = "=0.24.2", default-features = false, features = [
    "aes256", "bzip2", "compress", "ppmd", "deflate", "lz4", "brotli",
] }

# M2 (docs/M2.md §1). Both already come in through rmcp and Tauri.
uuid = { version = "1.29.0", features = ["v4"] }
url  = "2.5.8"
tokio-util = "0.7.20"   # rmcp's RequestContext::ct is a tokio_util CancellationToken
dialoguer  = { version = "0.12.0", default-features = false, features = ["password"] }
ctrlc      = "3.5.2"
proptest   = "1.12.0"
trycmd     = "1.2.1"
sha2       = "0.11.1"

[workspace.lints.rust]
unsafe_code = "deny"            # beezip-shell opts out with #![allow(unsafe_code)] in M4
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"            # clippy.toml: allow-unwrap-in-tests = true

[profile.dev]
debug = "line-tables-only"
[profile.release]
lto = true
codegen-units = 1
strip = true
# panic stays "unwind", NOT the Tauri template's "abort": the engine turns a decoder panic into
# CmdError::Internal, and beezip-shell must catch_unwind in every COM method (PLAN §1, Explorer).

# The pure-Rust codecs are 10-50x slower unoptimised, which makes the round-trip proptests crawl.
# Optimise just them (and zstd's C) in dev and test builds; our own crates keep full debug info.
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.brotli-decompressor]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.libbz2-rs-sys]
opt-level = 3
# libbz2-rs-sys 0.2.6 lets a counter wrap on bad data and then rejects the data, as the C does;
# with overflow checks that wrap is a panic instead (found by the sevenz fuzzer, docs/M3.md §11).
overflow-checks = false
[profile.dev.package.lz4_flex]
opt-level = 3
[profile.dev.package.snap]
opt-level = 3
[profile.dev.package.ppmd-rust]
opt-level = 3
[profile.dev.package.deflate64]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.sevenz-rust2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
