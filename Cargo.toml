[workspace]
resolver = "3"
members = [
    "crates/beezip-core", "crates/beezip-commands", "crates/beezip-mcp",
    "crates/beezip-cli", "crates/beezip-shell", "apps/desktop/src-tauri", "xtask",
]
# A plain `cargo build`/`cargo test` skips the Tauri app (~450 extra crates). CI and the checklist pass --workspace.
default-members = [
    "crates/beezip-core", "crates/beezip-commands", "crates/beezip-mcp",
    "crates/beezip-cli", "crates/beezip-shell", "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
beezip-core     = { path = "crates/beezip-core" }
beezip-commands = { path = "crates/beezip-commands" }
beezip-mcp      = { path = "crates/beezip-mcp" }

# Stable APIs: caret at today's version; Cargo.lock pins the build.
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror  = "2.0.21"
anyhow     = "1.0.104"
clap       = { version = "4.6.7", features = ["derive", "wrap_help"] }
schemars   = "1.2.3"   # must match rmcp's major (rmcp 3.8 -> schemars 1.2); tool schemas pass straight through
tokio      = { version = "1.54.1", features = ["rt", "macros"] }

# Churny APIs: exact pins, bumped on purpose (PLAN §5).
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
rmcp  = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
tauri               = "=2.12.5"   # same minor as @tauri-apps/api + cli (2.12.4); tauri build rejects a mismatch
tauri-build         = "=2.7.4"
tauri-plugin-opener = "=2.7.2"

assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "deny"            # beezip-shell opts out with #![allow(unsafe_code)] in M4
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"            # clippy.toml: allow-unwrap-in-tests = true

[profile.dev]
debug = "line-tables-only"
[profile.release]
lto = true
codegen-units = 1
strip = true
# panic stays "unwind", NOT the Tauri template's "abort": the engine turns a decoder panic into
# CmdError::Internal, and beezip-shell must catch_unwind in every COM method (PLAN §1, Explorer).
