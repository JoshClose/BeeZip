# cargo-deny 0.20: `cargo deny check`. License policy from PLAN §2.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# Unmaintained crates deep in Tauri's tree are not actionable here; vulnerabilities still fail.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "MIT-0",                           # ppmd-rust (CC0-1.0 OR MIT-0), used by zip's PPMd support
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",  # target-lexicon (Tauri's Linux build deps); only adds permissions
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "bzip2-1.0.6",
]
unused-allowed-license = "allow"
exceptions = [                       # MPL-2.0, unmodified, pulled in by Tauri 2.12; listed in THIRD_PARTY_NOTICES
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # UnRAR (docs/M3.md §1): extraction only, its license notice shipped in THIRD_PARTY_NOTICES.
    { allow = ["LicenseRef-UnRAR"], crate = "unrar_sys" },
    # backhand's hashes (docs/M5.md §1): the Boost license is permissive and OSI-approved. A
    # per-crate exception keeps any other BSL crate visible.
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]

# unrar_sys declares `MIT OR Apache-2.0`, which covers its bindings, but it compiles UnRAR's own
# C++, which is under the UnRAR license. Without this, cargo-deny would pass it unnoticed.
[[licenses.clarify]]
crate = "unrar_sys"
expression = "(MIT OR Apache-2.0) AND LicenseRef-UnRAR"
license-files = [{ path = "vendor/unrar/license.txt", hash = 0x46456911 }]   # XxHash32, seed 0

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"           # Tauri alone brings schemars 0.8/0.9/1.x and thiserror 1/2
wildcards = "deny"
allow-wildcard-paths = true          # our path deps

[sources]
unknown-registry = "deny"
unknown-git = "deny"
