# `cargo xtask notices`'s own settings (docs/M6.md §9.1), beside the hand-written parts of
# THIRD_PARTY_NOTICES.md (header.md, code-taken-in.md). cargo-about's are in about.toml.

# Crates that ship no license text, with no copy in another crate of Cargo.lock that about.toml
# could name: cargo-about runs offline, so it falls back to the license's canonical text, which
# has no copyright line. Any other crate that falls back fails `cargo xtask notices`, and so does
# a crate listed here that has a text of its own now.
no-license-file = [
    "backhand",            # MIT OR Apache-2.0; the license files are at the root of its repository
    "ts-rs",               # MIT, likewise
    "ts-rs-macros",
    "unrar_sys",           # its bindings' MIT OR Apache-2.0 (UnRAR's own license is there)
    "webview2-com",        # MIT, likewise
    "webview2-com-macros",
    "webview2-com-sys",
]

# License texts for the npm packages in the bundle that ship none (the Vite plugin in
# apps/desktop/vite.config.ts lists each package's license files). One that ships its own text
# fails `cargo xtask notices` while it is still named here.

# The JavaScript halves of Tauri's plugins ship only LICENSE.spdx. Their text is the LICENSE_MIT
# of the same plugin directory of tauri-apps/plugins-workspace, which their crates ship (the
# tauri-plugin-dialog 2.8.4 and tauri-plugin-opener 2.7.2 crates, identical).
