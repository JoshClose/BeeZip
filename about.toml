# cargo-about 0.9.3's config for THIRD_PARTY_NOTICES.md, which `cargo xtask notices` generates
# (docs/M6.md §9.1). It runs cargo-about once for each shipped crate (beezip-desktop, beezip-cli,
# beezip-shell) and merges the results: cargo-about takes one package or the whole workspace,
# which would add xtask. cargo-about rejects keys it doesn't know, so what isn't cargo-about's
# lives in packaging/notices/.

# deny.toml's allowlist, in the same order: for `A OR B`, the first one listed is the one taken.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "bzip2-1.0.6",
]

# What the installer ships is built for this target only.
targets = ["x86_64-pc-windows-msvc"]

# Test-only crates never reach a user. Build dependencies stay in: proc macros and build
# scripts generate code that is compiled into the binaries.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Workspace crates are publish = false: they are BeeZip itself, not third parties.
private = { ignore = true }

# chrono's LICENSE.txt holds both its licenses; cargo-about's own workaround splits it.
workarounds = ["chrono"]

# Crates whose license text cargo-about doesn't find. It then falls back to the license's
# canonical text, which has no copyright line, and `cargo xtask notices` fails unless the crate
# is listed in packaging/notices/no-license-file.txt. The paths are the crate's own files, or
# (`../`) another crate's from the same repository in cargo's registry: it runs `--offline`, so
# it can't fetch a file from the crate's git repository. A crate missing from the graph gets a
# warning, not an error.
#
# windows-rs ships its licenses as `license-mit` and `license-apache-2.0`, and the Tauri plugins
# as `LICENSE_MIT`: names cargo-about doesn't look for.
windows.clarify             = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-collections.clarify = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-core.clarify        = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-future.clarify      = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-implement.clarify   = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-interface.clarify   = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-link.clarify        = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-numerics.clarify    = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-registry.clarify    = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-result.clarify      = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-strings.clarify     = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-sys.clarify         = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-threading.clarify   = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-version.clarify     = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
tauri-plugin-dialog.clarify = { license = "Apache-2.0 OR MIT", files = [{ path = "LICENSE_MIT", license = "MIT", checksum = "89ff9689dcf9dd53968785d05a26f7898bb169dbfcada8d032b3e68cf0d55607" }] }
tauri-plugin-fs.clarify     = { license = "Apache-2.0 OR MIT", files = [{ path = "LICENSE_MIT", license = "MIT", checksum = "89ff9689dcf9dd53968785d05a26f7898bb169dbfcada8d032b3e68cf0d55607" }] }
tauri-plugin-opener.clarify = { license = "Apache-2.0 OR MIT", files = [{ path = "LICENSE_MIT", license = "MIT", checksum = "89ff9689dcf9dd53968785d05a26f7898bb169dbfcada8d032b3e68cf0d55607" }] }
tauri-plugin-updater.clarify = { license = "Apache-2.0 OR MIT", files = [{ path = "LICENSE_MIT", license = "MIT", checksum = "89ff9689dcf9dd53968785d05a26f7898bb169dbfcada8d032b3e68cf0d55607" }] }
tauri-plugin-single-instance.clarify = { license = "Apache-2.0 OR MIT", files = [{ path = "LICENSE_MIT", license = "MIT", checksum = "b7f455413bfe5f9d7da501a4468d4c5f866a432c325947e98cc9535e8b26cd6d" }] }
# tauri-plugin (the plugins' build helper) lives in Tauri's own repository and ships no license:
# the tauri crate's is that repository's. Its path follows tauri's exact pin in Cargo.toml.
tauri-plugin.clarify = { license = "Apache-2.0 OR MIT", files = [{ path = "../tauri-2.12.5/LICENSE-MIT", license = "MIT", checksum = "9dd42ea92cff2ede5cd477cbfcce051b2d0115c0ac7f368ee88cb545055dff1d" }] }
# alloc-stdlib lives in alloc-no-stdlib's repository and ships no license; alloc-no-stdlib does.
alloc-stdlib.clarify = { license = "BSD-3-Clause", files = [{ path = "../alloc-no-stdlib-3.0.0/LICENSE", checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae" }] }
# BSD-3-Clause OR MIT, and it ships only the BSD text (© Dropbox): BeeZip takes BSD-3-Clause.
brotli-decompressor.clarify = { license = "BSD-3-Clause", files = [{ path = "LICENSE", checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae" }] }
# Apache-2.0 OR MIT, and it ships only the Apache text (© Kornel Lesiński): BeeZip takes Apache-2.0.
cargo_toml.clarify = { license = "Apache-2.0", files = [{ path = "LICENSE", checksum = "ee874098519e956c23a3c5c7e20581f8e9b1d70aa05eb178f983be9775090a2f" }] }
# Apache-2.0 AND MIT: winit's Apache text, and libm's MIT text with its copyright lines, under
# a name cargo-about doesn't detect.
dpi.clarify = { license = "Apache-2.0 AND MIT", files = [
    { path = "LICENSE", license = "Apache-2.0", checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a" },
    { path = "LICENSE-LIBM-MIT", license = "MIT", checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997" },
] }
# CC0-1.0 OR MIT-0 OR Apache-2.0, and it ships only the CC0 text: BeeZip takes CC0-1.0, accepted
# for dunce alone (deny.toml passes it as MIT-0).
dunce.accepted = ["CC0-1.0"]
dunce.clarify = { license = "CC0-1.0", files = [{ path = "LICENSE", checksum = "a2010f343487d3f7618affe54f789f5487602331c0a8d03f49e9a7c547cf0499" }] }
# MIT, wrapped narrower than cargo-about's detector matches.
minisign-verify.clarify = { license = "MIT", files = [{ path = "LICENSE", checksum = "42c8695fbc468866d9756be99af0ba4e37d733f8daa3c8827c8d80b8bec1b2f9" }] }
# Apache-2.0 without the appendix, which cargo-about's detector doesn't take for Apache-2.0.
sync_wrapper.clarify = { license = "Apache-2.0", files = [{ path = "LICENSE", checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594" }] }
# rmcp declares Apache-2.0, but its LICENSE says the MCP project is moving from MIT to Apache-2.0
# and that contributions whose authors haven't agreed to the change stay under MIT. The file holds
# both texts (and a note on documentation, which BeeZip doesn't ship), so BeeZip takes both.
rmcp.clarify = { license = "Apache-2.0 AND MIT", files = [
    { path = "LICENSE", license = "Apache-2.0", start = "                                 Apache License", end = "END OF TERMS AND CONDITIONS", checksum = "447523816cc73790680a0eab741ef8653bb7e4bb224ceb569ded9dcfa515c3f0" },
    { path = "LICENSE", license = "MIT", start = "MIT License\n\nCopyright", end = "SOFTWARE.", checksum = "f61525dadbbe4c63bc889f612eddde4f56986ec9ebd0c6a78ec2c6c82120d228" },
] }
# Its license files only: cargo-about would also take the WHATWG license a second time, with `//`
# in front of each line, from the header of src/gb18030_2022.rs.
encoding_rs.clarify = { license = "(Apache-2.0 OR MIT) AND BSD-3-Clause", files = [
    { path = "LICENSE-MIT", license = "MIT", checksum = "3fa4ca83dcc9237839b1bdeb2e6d16bdfb5ec0c5ce42b24694d8bbf0dcbef72c" },
    { path = "LICENSE-WHATWG", license = "BSD-3-Clause", checksum = "838118388fe5c2e7f1dbbaeed13e1c7f3ebf88be91319c7c1d77c18e987d1a50" },
] }

# MPL-2.0, unmodified, through Tauri (deny.toml exceptions).
[option-ext]
accepted = ["MPL-2.0"]
[cssparser]
accepted = ["MPL-2.0"]
[cssparser-macros]
accepted = ["MPL-2.0"]
[dtoa-short]
accepted = ["MPL-2.0"]
[selectors]
accepted = ["MPL-2.0"]

# backhand's xxHash (deny.toml exception).
[xxhash-rust]
accepted = ["BSL-1.0"]

# unrar_sys declares MIT OR Apache-2.0 for its bindings but compiles UnRAR's C++, which is under
# the UnRAR license (deny.toml's clarification). Its text comes from the crate's vendored copy.
[unrar_sys]
accepted = ["LicenseRef-UnRAR"]

[unrar_sys.clarify]
license = "(MIT OR Apache-2.0) AND LicenseRef-UnRAR"

# The file's own id must NOT be LicenseRef-UnRAR: cargo-about 0.9.3 inverts the check for
# LicenseRef-* texts (generate.rs:172, `if expr.requirements().any(..) { return None }`), so a file
# clarified as LicenseRef-UnRAR is dropped ("LicenseRef-UnRAR has no license file") and a file with
# any other id is taken as its text. Rename it back once that is fixed. No other file may be added
# here: with the inverted check, it would be taken as UnRAR's text too.
[[unrar_sys.clarify.files]]
path = "vendor/unrar/license.txt"
license = "LicenseRef-UnRAR-file"
checksum = "6ecc1687808b7d66b24f874755abfed7464d9751ed0001cd4e8e5d9bf397ff8a"
