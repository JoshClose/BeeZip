[package]
edition = "2024"
rust-version = "1.88.0"
name = "hadris-iso"
version = "3.0.0-rc.3"
authors = ["hxyulin"]
build = false
exclude = ["/spec"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure Rust ISO 9660 library with allocation-free reading, Joliet, Rock Ridge, El Torito, hybrid boot and sessions"
homepage = "https://hxyulin.github.io/hadris/"
readme = "README.md"
keywords = [
    "iso9660",
    "joliet",
    "rock-ridge",
    "el-torito",
    "no-std",
]
categories = [
    "filesystem",
    "embedded",
    "no-std",
]
license = "MIT"
repository = "https://github.com/hxyulin/hadris"

[package.metadata.docs.rs]
features = [
    "std",
    "sync",
    "async",
    "write",
    "tracing",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
alloc = [
    "hadris-io/alloc",
    "hadris-fs/alloc",
    "hadris-storage/alloc",
]
async = [
    "hadris-io/async",
    "hadris-fs/async",
    "hadris-storage/async",
    "hadris-part?/async",
]
default = [
    "std",
    "sync",
    "write",
]
std = [
    "alloc",
    "hadris-io/std",
    "hadris-fs/std",
    "hadris-storage/std",
    "hadris-part?/std",
    "tracing?/std",
]
sync = [
    "hadris-io/sync",
    "hadris-fs/sync",
    "hadris-storage/sync",
    "hadris-part?/sync",
]
tracing = [
    "dep:tracing",
    "hadris-part?/tracing",
]
write = [
    "alloc",
    "dep:hadris-part",
    "hadris-part/alloc",
]

[lib]
name = "hadris_iso"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.9.0"

[dependencies.bytemuck]
version = "1.22.0"
features = [
    "derive",
    "min_const_generics",
]
default-features = false

[dependencies.hadris-fs]
version = "3.0.0-rc.3"
default-features = false

[dependencies.hadris-io]
version = "3.0.0-rc.3"
default-features = false

[dependencies.hadris-iso-raw]
version = "0.2.0"
default-features = false

[dependencies.hadris-macros]
version = "3.0.0-rc.2"

[dependencies.hadris-part]
version = "3.0.0-rc.3"
optional = true
default-features = false

[dependencies.hadris-storage]
version = "3.0.0-rc.3"
default-features = false

[dependencies.tracing]
version = "0.1.41"
features = ["attributes"]
optional = true
default-features = false

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(kani)"]
