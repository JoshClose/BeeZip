[lib]
name = "fstool"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies.charcode]
version = "0.1.3"
features = [
    "std",
    "euc-kr",
    "shift-jis",
    "euc-jp",
    "single-byte",
]
optional = true
default-features = false

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.compcol]
version = "0.7.8"
features = [
    "std",
    "checksum",
]
optional = true
default-features = false

[dependencies.fuser]
version = "0.16"
features = ["libfuse"]
optional = true

[dependencies.intl]
version = "0.6.3"
features = [
    "case",
    "full",
]
optional = true
default-features = false

[dependencies.log]
version = "0.4"
optional = true

[dependencies.purecrypto]
version = "0.10.3"
features = [
    "std",
    "cipher",
    "hash",
    "kdf",
    "rng",
]
optional = true
default-features = false

[dependencies.rustyline]
version = "15"
optional = true

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.tomlproc]
version = "0.1.1"
features = ["serde"]
optional = true
default-features = false

[dependencies.uuid]
version = "1"
default-features = false

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.lzfse_rust]
version = "0.2"

[dev-dependencies.tempfile]
version = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.uuid]
version = "1"
features = [
    "v4",
    "js",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "=0.2.121"
optional = true

[target."cfg(unix)".dependencies.libc]
version = "0.2"
optional = true
