name: CI
on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:   # block style: `${{ }}` braces break a YAML flow map
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BEEZIP_GIT_SHA: ${{ github.sha }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: bash } }   # bash -e: a failing first line fails the step (pwsh only checks the last exit code)
    env:
      BEEZIP_REQUIRE_7Z: "1"           # the interop tests fail instead of skipping without 7-Zip
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install    # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/desktop/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/desktop/pnpm-lock.yaml }

      - name: rustfmt
        run: cargo fmt --all --check
      - name: Generated files are current (TS bindings, the menu's extensions)
        run: |
          cargo xtask codegen
          git diff --exit-code -- apps/desktop/src/gen crates/beezip-menu/src/gen_exts.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: Explorer's classic menu, end to end (docs/M4.md §10)
        run: |
          cargo build --locked -p beezip-cli -p beezip-shell --examples
          pwsh -NoProfile -File .github/scripts/shell-classic.ps1
      - uses: taiki-e/install-action@v2    # cargo-deny-action is a Docker action, so Linux-only
        with: { tool: cargo-deny@0.20.2 }
      - name: cargo-deny
        run: cargo deny check
      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Frontend tests (vitest)
        working-directory: apps/desktop
        run: pnpm test
      - name: A throwaway certificate for the Windows 11 menu's package, trusted on the runner only
        shell: pwsh
        run: |
          cargo xtask dev-cert
          if ($LASTEXITCODE) { exit 1 }
          Import-Certificate -FilePath target/dev-cert/BeeZip-Dev.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
      - name: Installer (debug) with the signed package, which also runs tsc and vite build
        run: cargo xtask dist --debug --sign-dev
      - uses: taiki-e/install-action@v2    # cargo-about's own 0.9.3 release build, made with its `cli` feature
        with: { tool: cargo-about@0.9.3 }
      - name: Third-party notices are current, with the npm packages vite build listed (docs/M6.md §9.1)
        run: cargo xtask notices --check
      - name: Every program in the installer is signed, nsExec.dll included (docs/M6.md §9.2)
        run: pwsh -NoProfile -File .github/scripts/signed-setup.ps1 target/dist/debug/bundle/nsis/*-setup.exe -Subject 'CN=BeeZip Dev'
      - name: The winget manifest, from this installer, passes winget validate (docs/M6.md §9.6)
        run: |
          cargo xtask winget --local
          pwsh -NoProfile -File .github/scripts/winget-validate.ps1 "$(find target/winget/manifests -name BeeZip.BeeZip.yaml -printf '%h')"
      - name: Explorer's Windows 11 menu, end to end (docs/M4.md §10)
        run: pwsh -NoProfile -File .github/scripts/shell-modern.ps1
      - name: A reinstall and an uninstall while beezip mcp holds the CLI (docs/M6.md §9.3)
        run: pwsh -NoProfile -File .github/scripts/locked-cli.ps1
      - name: tauri-driver, for the end-to-end test
        run: cargo install --locked tauri-driver --version 2.1.0
      - name: End to end through WebDriver, an archive opened by a second launch right away (docs/M6.md §8.1, §10)
        run: pwsh -NoProfile -File .github/scripts/e2e.ps1
      - name: BeeZip's own installer, read through 7-Zip as an NSIS installer (docs/M6.md §10)
        run: bash .github/scripts/nsis-setup.sh
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: beezip-setup-debug
          path: target/dist/debug/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEEZIP_REQUIRE_GNU_TAR: "1"      # and without GNU tar
      BEEZIP_REQUIRE_LINUX_TOOLS: "1"  # gzip, lzop, uncompress, cpio, ar, xorriso and unsquashfs check BeeZip's output (docs/M5.md §10, docs/M6.md §10)
      BEEZIP_REQUIRE_7Z_BACKEND: "1"   # the 7-Zip backend's tests fail instead of skipping without 7zz (docs/M6.md §3)
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: The Linux tools the interop tests run
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends lzop ncompress cpio binutils squashfs-tools xorriso
      - name: 7-Zip's own Linux build, 26.00 (Ubuntu's 7zip is 23.01, too old for the backend)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/7z.tar.xz" https://www.7-zip.org/a/7z2600-linux-x64.tar.xz
          echo "c74dc4a48492cde43f5fec10d53fb2a66f520e4a62a69d630c44cb22c477edc6  $RUNNER_TEMP/7z.tar.xz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/7zip"
          tar -C "$RUNNER_TEMP/7zip" -xf "$RUNNER_TEMP/7z.tar.xz" 7zz
          echo "$RUNNER_TEMP/7zip" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p beezip-core -p beezip-menu -p beezip-commands -p beezip-mcp -p beezip-cli
        env:
          BEEZIP_IMAGES_OUT: ${{ runner.temp }}/images   # the ISO and DMG the macOS job mounts
      - name: Keep BeeZip's ISO and DMG for macOS
        uses: actions/upload-artifact@v7
        with:
          name: beezip-images
          path: ${{ runner.temp }}/images
          if-no-files-found: error
          retention-days: 7

  # Nobody here has a Mac: macOS mounts the images BeeZip wrote on Linux and checks every file,
  # and the DMG's checksums and volume (docs/M5.md §10). It runs no Rust.
  macos:
    needs: linux
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: beezip-images, path: images }
      - run: bash .github/scripts/mac-images.sh images
