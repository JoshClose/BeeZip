name: Fuzz
on:
  schedule:
    - cron: "23 3 * * *"          # nightly; scheduled runs use the default branch (master)
  pull_request:
    paths: ["fuzz/**", "crates/beezip-core/**", "crates/beezip-menu/**"]
  workflow_dispatch:
permissions: { contents: read, actions: read }   # actions: the corpora, from earlier runs' artifacts
# Expressions stay in block style: `${{ }}` inside a `{ }` flow map broke CI once (M0).
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [detect, zip, tar, sevenz, rar, codecs, paths, menu, cpio, ar, rpm, cab, lzh, iso, squashfs, dmg, part, xz-scan, arj, ace, zoo, arc, xar, fat, ext, ntfs, msi, vhd, vhdx, vdisk, xpress, wof, wim, chm, cramfs, nsis, bhive, bhive-index, bhive-sealed, bhive-keyblock]
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@v7
      # cargo-fuzz needs nightly; the repo's rust-toolchain.toml pins stable for everything else.
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      # Each target's corpus is an artifact of the last nightly run, not an Actions cache: Rust's
      # build caches take most of the repository's 10 GB, and a release's new set of them got the
      # corpora evicted. A pull request starts from master's corpus and doesn't save its own.
      - name: Corpus from the last nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          newest='[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty'   # newest first
          run=$(gh api "repos/$GH_REPO/actions/artifacts?name=corpus-$TARGET&per_page=20" --jq "$newest")
          if [ -n "$run" ]; then gh run download "$run" -n "corpus-$TARGET" -D "fuzz/corpus/$TARGET"; fi
          echo "$(ls "fuzz/corpus/$TARGET" | wc -l) inputs in the corpus, from run ${run:-none}"
      # wimlib's library, which the WIM reader loads for LZMS (docs/M11.md §6.2).
      - if: matrix.target == 'wim'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libwim15t64
      # libFuzzer reads the seed directories recursively, so all of tests/fixtures seeds it.
      # The prebuilt cargo-fuzz is a musl binary and defaults --target to its own triple, where
      # the sanitizer can't link, so the target is explicit.
      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        run: >
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          fuzz/corpus/${{ matrix.target }} tests/fixtures
          -- -max_total_time=$SECONDS_PER_TARGET -rss_limit_mb=2048 -timeout=60
      # Saved when the fuzzer ran, whether or not it found a crash, so a night's coverage isn't lost.
      - if: ${{ !cancelled() && steps.fuzz.outcome != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v7
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
