# Releases (docs/M6.md §9.5, §9.7). A `v*` tag (made after `cargo xtask release --version V`)
# builds the Windows installer and portable zip (signed when the repository has signing set up),
# the Linux deb, rpm and AppImage, and the macOS disk image (arm64, signed ad hoc), and PUBLISHES
# the release vV with them, the updater's bundles and .sig files, and one latest.json. It goes up
# as a draft first and is published once every file is there. GitHub adds the source code's zip
# and tar.gz itself. Run by hand (Actions > Release > Run workflow), it is a dry run: the same
# builds, kept as the run's artifacts, and no release.
#
# Before 1.0.0, Windows gets the portable zip only: the installer waits for 1.0.0, which must be
# signed. A tag of 1.0.0 or later with no signing set up stops in the `windows` job.
#
# The `windows` job runs in the `release` environment, whose deployment rules decide which refs
# may use its secrets and Azure sign-in: `v*` tags, and `master` for signed dry runs. Signing,
# from the environment's (or the repository's) variables and secrets:
# - Azure Artifact Signing, when the variables AZURE_CLIENT_ID, AZURE_TENANT_ID,
#   AZURE_SUBSCRIPTION_ID, ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT and
#   ARTIFACT_SIGNING_PROFILE are set: azure/login signs in with OIDC, through an Entra app whose
#   federated credential trusts this repository's `release` environment, so no secret is stored;
# - else a certificate file, when the secret BEEZIP_SIGN_PFX (the .pfx, base64) is set, with
#   BEEZIP_SIGN_PFX_PASSWORD;
# - else unsigned, with a warning: releases before 1.0.0 may be, and 1.0.0 and later may not.
# The updater's signature needs the secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and the public key committed in packaging/updater.pub.
#
# The `linux` and `macos` jobs run in the same environment, for the updater's key. Each platform
# uploads an artifact with its bundles, their .sig files and a latest.json of its own; `release`
# merges the latest.json files into one. macOS is signed ad hoc: a Developer ID ($99 a year, the
# account holder's) would need its certificate imported into a keychain before `xtask dist`, which
# signs the CLI with APPLE_SIGNING_IDENTITY, and notarization's App Store Connect key (§14).
#
# No caches: a release builds from nothing, so no cache written by another run can reach it.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
concurrency:   # block style: `${{ }}` braces break a YAML flow map
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BEEZIP_GIT_SHA: ${{ github.sha }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      id-token: write   # the OIDC token azure/login trades for Artifact Signing's; nothing else
    defaults: { run: { shell: bash } }
    outputs:
      signed: ${{ steps.sign.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: rustup toolchain install    # reads rust-toolchain.toml
      - name: The tag is the workspace's version
        if: github.event_name == 'push'
        run: cargo xtask release --check-tag "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/desktop/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: How to sign, from the settings
        id: sign
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          HAS_PFX: ${{ secrets.BEEZIP_SIGN_PFX != '' }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$ARTIFACT_SIGNING_ACCOUNT" ]; then
            mode=artifact
          elif [ "$HAS_PFX" = true ]; then
            mode=pfx
          else
            mode=none
            echo "::warning::This build is unsigned: the repository has no Artifact Signing variables and no BEEZIP_SIGN_PFX secret."
          fi
          if [ "$HAS_UPDATER_KEY" != true ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: no updater signature (.sig) or latest.json, so installed copies won't see this release."
          fi
          echo "signing: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          # From 1.0.0 a release carries the installer, and an unsigned one is never published.
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${version%%.*}" -ge 1 ] && [ "$mode" = none ]; then
            echo "::error::$GITHUB_REF_NAME would publish the installer unsigned: from 1.0.0 a release carries the installer, so set up signing first."
            exit 1
          fi

      - name: Sign in to Azure with OIDC, for Artifact Signing
        if: steps.sign.outputs.mode == 'artifact'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Artifact Signing's signtool plugin (Microsoft.ArtifactSigning.Client 1.0.151, checked)
        if: steps.sign.outputs.mode == 'artifact'
        shell: pwsh
        run: |
          # The runner's Windows SDK has signtool 10.0.26100, new enough; the dlib needs .NET 10,
          # which the runner has. sign.ps1 checks signtool's version.
          $zip = Join-Path $env:RUNNER_TEMP 'artifact-signing-client.zip'
          Invoke-WebRequest -Uri https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.151/microsoft.artifactsigning.client.1.0.151.nupkg -OutFile $zip -MaximumRetryCount 4 -RetryIntervalSec 15
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne '35375A4BC4E1102DA729FC3D8D9925F774C3BAAE6B8B7FF6398D948CA9AB0D8A') { Write-Host "::error::the package's SHA-256 is $hash"; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing-client'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "BEEZIP_ARTIFACT_DLIB=$(Join-Path $dir 'bin\x64\Azure.CodeSigning.Dlib.dll')" >> $env:GITHUB_ENV
      - name: The certificate file, from its secret
        if: steps.sign.outputs.mode == 'pfx'
        shell: pwsh
        env:
          PFX: ${{ secrets.BEEZIP_SIGN_PFX }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'beezip-sign.pfx'
          [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:PFX))
          "BEEZIP_SIGN_PFX=$file" >> $env:GITHUB_ENV

      - name: Tauri's NSIS, fetched with retries (Tauri's own single download has failed with a 504)
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/tauri-nsis.ps1
      - name: Installer (release)
        env:
          BEEZIP_SIGN: ${{ steps.sign.outputs.mode }}
          BEEZIP_SIGN_PFX_PASSWORD: ${{ secrets.BEEZIP_SIGN_PFX_PASSWORD }}
          BEEZIP_ARTIFACT_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          BEEZIP_ARTIFACT_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          BEEZIP_ARTIFACT_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo xtask dist
      - name: Every program in the installer and the portable zip is signed and timestamped
        if: steps.sign.outputs.mode != 'none'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/dist/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          pwsh -NoProfile -File .github/scripts/signed-setup.ps1 $setup.FullName -Timestamped
          if ($LASTEXITCODE) { exit 1 }
          $signer = (Get-AuthenticodeSignature -LiteralPath $setup.FullName).SignerCertificate.Subject
          $zip = Get-ChildItem target/dist/release/bundle/portable -Filter '*-portable.zip' | Select-Object -First 1
          pwsh -NoProfile -File .github/scripts/portable.ps1 $zip.FullName -Subject $signer -Timestamped
          if ($LASTEXITCODE) { exit 1 }
      - name: The portable zip holds the installer's programs, and its CLI runs
        if: steps.sign.outputs.mode == 'none'
        run: pwsh -NoProfile -File .github/scripts/portable.ps1 target/dist/release/bundle/portable/*-portable.zip
      - name: Forget the certificate file
        if: always() && steps.sign.outputs.mode == 'pfx'
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'beezip-sign.pfx') -Force -ErrorAction SilentlyContinue

      - name: Keep the release's files
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/dist/release/bundle/nsis/*-setup.exe
            target/dist/release/bundle/nsis/*-setup.exe.sig
            target/dist/release/bundle/portable/*-portable.zip
            target/dist/release/bundle/portable/*-portable.zip.sig
            target/dist/release/bundle/latest.json
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04    # its glibc (2.35) is the oldest the packages run on; built on 24.04 they'd want 2.39 (§16, PR 6)
    timeout-minutes: 90
    environment: release
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: rustup toolchain install
      - name: The tag is the workspace's version
        if: github.event_name == 'push'
        run: cargo xtask release --check-tag "$GITHUB_REF_NAME"
      - name: Tauri's build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf file \
            rpm desktop-file-utils shared-mime-info
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/desktop/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: The packages (release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo xtask dist
      - name: What the packages hold
        run: bash .github/scripts/linux-bundle.sh check release
      - name: Keep the release's files
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/dist/release/bundle/deb/beezip_*_amd64.deb*
            target/dist/release/bundle/rpm/beezip-*.x86_64.rpm*
            target/dist/release/bundle/appimage/beezip_*_amd64.AppImage*
            target/dist/release/bundle/latest.json
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest    # arm64 (§9.7)
    timeout-minutes: 90
    environment: release
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: rustup toolchain install
      - name: The tag is the workspace's version
        if: github.event_name == 'push'
        run: cargo xtask release --check-tag "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/desktop/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: The app and its disk image (release, signed ad hoc)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo xtask dist
      - name: Keep the release's files
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            target/dist/release/bundle/dmg/BeeZip_*_aarch64.dmg
            target/dist/release/bundle/macos/BeeZip_*_aarch64.app.tar.gz
            target/dist/release/bundle/macos/BeeZip_*_aarch64.app.tar.gz.sig
            target/dist/release/bundle/macos/latest.json
          if-no-files-found: error
          retention-days: 14

  # Only for a tag: a dry run stops at the artifacts.
  release:
    needs: [windows, linux, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the release and its files
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNED: ${{ needs.windows.outputs.signed }}
    steps:
      - uses: actions/checkout@v7    # for release-files.sh
        with: { persist-credentials: false, path: repo }
      - uses: actions/download-artifact@v8
        with: { path: files }
      - name: The files to release (before 1.0.0, no Windows installer), and one latest.json naming them
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash repo/.github/scripts/release-files.sh files "$version" latest.json
          if [ "${version%%.*}" -eq 0 ]; then
            echo "$GITHUB_REF_NAME is before 1.0.0: Windows gets the portable zip, not the installer." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: The release, published
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # Every platform's files, by name: they must not clash.
          mapfile -t release_files < <(find files -type f ! -name latest.json | sort)
          dups=$(printf '%s\n' "${release_files[@]##*/}" | sort | uniq -d)
          if [ -n "$dups" ]; then echo "::error::two platforms made files of one name: $dups"; exit 1; fi
          if [ -f latest.json ]; then release_files+=(latest.json); fi
          {
            if [ "${version%%.*}" -eq 0 ]; then
              echo "**Windows:** unzip \`BeeZip_${version}_x64-portable.zip\` anywhere and run \`BeeZip.exe\`. Nothing is installed; the README in the zip says the rest. The installer comes with BeeZip 1.0.0."
            else
              echo "**Windows:** \`BeeZip_${version}_x64-setup.exe\` installs BeeZip; \`BeeZip_${version}_x64-portable.zip\` runs it from a folder, without installing."
            fi
            if [ "$SIGNED" = none ]; then
              echo
              echo "These Windows programs aren't signed yet, so Windows asks before the first run: choose *More info*, then *Run anyway*."
            fi
            echo
            echo "**Linux:** the deb, the rpm or the AppImage. **macOS** (Apple silicon): the disk image. It's signed ad hoc, so the first time, macOS opens BeeZip only after System Settings › Privacy & Security › *Open Anyway*."
          } > notes.md
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$tag is already published: a published release is never changed"
              exit 1
            fi
            echo "the draft $tag is there already, from an earlier run: replacing its files"
            gh release upload "$tag" "${release_files[@]}" --clobber
          else
            # A draft with every file first, then published, so nobody sees a release half there.
            # GitHub's notes (the pull requests since the last release) follow notes.md.
            gh release create "$tag" --draft --verify-tag --title "BeeZip ${version}" \
              --notes-file notes.md --generate-notes "${release_files[@]}"
          fi
          gh release edit "$tag" --draft=false
          echo "Published $tag: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
