name: Make DMG fixtures
# hdiutil's images of BeeZip's own fixture tree (docs/M5.md §10), made on a Mac since nobody here
# has one: tests/fixtures/make-dmg.sh says what the artifact holds. The images are committed to
# tests/fixtures/thirdparty/dmg/ with this run's id, and the manifest records merged.
on:
  workflow_dispatch:
  # For PR 5 only, so it can run before it's on master.
  push:
    branches: [m5-images]
    paths:
      - .github/workflows/make-dmg.yml
      - tests/fixtures/make-dmg.sh
permissions: { contents: read }

jobs:
  make:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # For decmpfs files of a chosen type (zlib, LZVN, LZFSE); the script makes do without it.
      - name: afsctool
        continue-on-error: true
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install afsctool
      - name: Make the images
        run: bash tests/fixtures/make-dmg.sh "$RUNNER_TEMP/dmg-fixtures"
      - name: Keep them
        uses: actions/upload-artifact@v7
        with:
          name: dmg-fixtures
          path: ${{ runner.temp }}/dmg-fixtures
          if-no-files-found: error
          retention-days: 30
