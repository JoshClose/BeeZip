[package]
name = "beezip-shell"
description = "BeeZip's Explorer context menu: a COM DLL serving one cascading IExplorerCommand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Small and self-contained, since it loads into explorer.exe (docs/M4.md §4.2): the menu model
# without its `wire` feature, and the Windows API.
[target.'cfg(windows)'.dependencies]
beezip-menu.workspace = true
windows-core.workspace = true
windows-registry.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell",
    "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
