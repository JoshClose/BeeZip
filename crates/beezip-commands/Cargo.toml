[package]
name = "beezip-commands"
description = "BeeZip command registry and job engine, shared by the CLI, the MCP server and the desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
beezip-core.workspace = true
# Your keys, certificates and devices, for encrypted and signed .bhive (docs/M14.md §8).
beezip-keys.workspace = true
beezip-menu = { workspace = true, features = ["wire"] }
clap.workspace = true
dirs.workspace = true
filetime.workspace = true
open.workspace = true
# SHA-256 for signers' fingerprints and `require_signer`, and passwords wiped when dropped
# (docs/M14.md §11): both already core's.
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
toml_edit.workspace = true
ts-rs.workspace = true
zeroize.workspace = true

# Explorer registration (docs/M4.md §5.5), from safe Rust: the registry, and the Windows 11
# menu's package through PackageManager.
[target.'cfg(windows)'.dependencies]
url.workspace = true
windows = { workspace = true, features = [
    "ApplicationModel", "Foundation", "Foundation_Collections", "Management_Deployment",
] }
windows-core.workspace = true
windows-future.workspace = true
windows-registry.workspace = true
windows-result.workspace = true

[lints]
workspace = true
