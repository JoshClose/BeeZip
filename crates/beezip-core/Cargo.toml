[package]
name = "beezip-core"
description = "BeeZip archive engine: formats, codecs and safe extraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# RAR through UnRAR (docs/M3.md §3.4). Without it, RAR archives are detected and then fail
# with `BackendUnavailable`.
default = ["rar"]
rar = ["dep:beezip-unrar"]

[dependencies]
beezip-unrar = { workspace = true, optional = true }
brotli.workspace = true
bzip2.workspace = true
cfb.workspace = true
crc32fast.workspace = true
backhand.workspace = true
delharc.workspace = true
encoding_rs.workspace = true
file-format.workspace = true
filetime.workspace = true
flate2.workspace = true
fstool.workspace = true
globset.workspace = true
hadris-fs.workspace = true
hadris-io.workspace = true
hadris-iso.workspace = true
hadris-storage.workspace = true
hadris-udf.workspace = true
lzfse_rust.workspace = true
lz4_flex.workspace = true
lzokay.workspace = true
lzma-rust2.workspace = true
md-5.workspace = true
sevenz-rust2.workspace = true
sha1.workspace = true
# xz blocks checked with SHA-256 (docs/M6.md §6.4); already built for lzma-rust2's xz.
sha2.workspace = true
memchr.workspace = true
oem_cp.workspace = true
quick-xml.workspace = true
snap.workspace = true
tar.workspace = true
tempfile.workspace = true
time.workspace = true
walkdir.workspace = true
zip.workspace = true
zlib-rs.workspace = true
zstd.workspace = true

# bench.rs reads the process's private bytes (docs/M6.md §7), safefs/disk.rs asks whether a
# destination's disk pays for seeks (§6.3), and format/wim/lzms_win.rs loads cabinet.dll's LZMS
# decoder from System32 (docs/M8.md §5.3).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO",
    "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus",
    "Win32_System_Registry", "Win32_System_Threading",
] }

# safefs/quarantine.rs reads and writes extended attributes (docs/M6.md §8.3).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
msi.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
